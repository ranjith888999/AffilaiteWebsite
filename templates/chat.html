{% extends "base.html" %}

{% block title %}DealsHub AI - Your Smart Shopping Assistant{% endblock %}

{% block content %}
<!-- DealsHub AI Chat Interface - Minimal Design -->
<section class="dealshub-chat-section">
    <div class="dealshub-container">
        <!-- Header with DealsHub Logo -->
        <div class="dealshub-header">
            <div class="dealshub-logo">
                <div class="logo-icon">
                    <i class="fas fa-percentage"></i>
                </div>
                <div class="logo-text">
                    <span class="brand-name">dealshub</span>
                    <span class="brand-ai">AI</span>
                </div>
            </div>
        </div>

        
        <!-- Search Input Area -->
        <div class="dealshub-input-area">
            <form id="dealshubForm" class="dealshub-form">
                <div class="dealshub-input-container">
                    <input 
                        type="text" 
                        id="dealshubInput" 
                        class="dealshub-input" 
                        placeholder="Ask anything about deals or products..."
                        autocomplete="off"
                        maxlength="500"
                    />
                    
                    <!-- Simple Actions -->
                    <div class="dealshub-actions">
                        <button type="button" class="dealshub-btn dealshub-btn-voice" id="voiceBtn" title="Voice search">
                            <i class="fas fa-microphone"></i>
                        </button>
                        
                        <button type="submit" class="dealshub-btn dealshub-btn-send" title="Search">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Loading Indicator -->
        <div class="dealshub-loading" id="loadingIndicator" style="display: none;">
            <div class="loading-spinner"></div>
            <span class="loading-text">Searching for deals...</span>
        </div>
    </div>
</section>

<!-- Chat Message Template -->
<template id="messageTemplate">
    <div class="dealshub-message">
        <div class="message-avatar">
            <div class="avatar-icon">
                <i class="fas fa-percentage"></i>
            </div>
        </div>
        <div class="message-content">
            <div class="message-text"></div>
            <div class="message-timestamp"></div>
        </div>
    </div>
</template>
{% endblock %}

{% block scripts %}
<script src="/static/js/dealshub-chat.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize DealsHub AI Chat
        if (window.DealsHubChat) {
            window.DealsHubChat.init();
        }
    });
</script>
{% endblock %}
