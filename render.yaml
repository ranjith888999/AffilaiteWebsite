services:
  - type: web
    name: affiliate-website
    env: docker
    region: ohio
    branch: feature/docker_enhancements
    plan: free
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    dockerCommand: ./startup.sh
    buildFilter:
      paths:
        - app/**
        - scripts/**
        - static/**
        - templates/**
        - .dockerignore
        - Dockerfile
        - startup.sh
        - init_render_database.py
        - requirements-core.txt
        - requirements-ml.txt
        - main.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: affiliate-db
          property: connectionString
      - key: DATABASE_HOST
        fromDatabase:
          name: affiliate-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: affiliate-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: affiliate-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: affiliate-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: affiliate-db
          property: password
      - key: CUELINKS_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PORT
        value: 8000

databases:
  - name: affiliate-db
    region: ohio
    plan: free
    databaseName: affiliate_website_db
    user: affiliate_user
    ipAllowList: []
    postgresMajorVersion: 15
    extensions:
      - vector
      - vector
