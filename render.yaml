services:
  - type: web
    name: affiliate-website
    runtime: python
    region: ohio
    branch: main
    plan: free
    buildFilter:
      paths:
        - "app/**"
        - "static/**"
        - "templates/**"
        - "main.py"
        - "requirements.txt"
    buildCommand: "pip install --no-build-isolation --only-binary=:all: -r requirements.txt || pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: affiliate-db
          property: connectionString
      - key: CUELINKS_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

databases:
  - name: affiliate-db
    region: ohio
    plan: free
    databaseName: affiliate_website_db
    user: affiliate_user
    ipAllowList: []
