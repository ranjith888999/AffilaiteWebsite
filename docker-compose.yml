version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: affiliate_db
    restart: always
    environment:
      POSTGRES_DB: affiliate_website
      POSTGRES_USER: affiliate_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - affiliate_network

  # FastAPI Application
  web:
    build: .
    container_name: affiliate_app
    restart: always
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=affiliate_website
      - DATABASE_USER=affiliate_user
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - CUELINKS_API_KEY=${CUELINKS_API_KEY}
      - CUELINKS_BASE_URL=https://api.cuelinks.com/v1
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${DOMAIN_NAME},www.${DOMAIN_NAME}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
      - app_logs:/app/logs
    networks:
      - affiliate_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: affiliate_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx-simple.conf:/etc/nginx/nginx.conf
      - ./static:/app/static
    depends_on:
      - web
    networks:
      - affiliate_network

volumes:
  postgres_data:
  app_logs:

networks:
  affiliate_network:
    driver: bridge
