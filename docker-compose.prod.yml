version: '3.8'

services:
  # Database with production settings
  db:
    restart: unless-stopped
    environment:
      POSTGRES_DB: affiliate_website
      POSTGRES_USER: affiliate_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: >
      postgres 
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # FastAPI Application with production settings
  web:
    restart: unless-stopped
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=affiliate_website
      - DATABASE_USER=affiliate_user
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - CUELINKS_API_KEY=${CUELINKS_API_KEY}
      - CUELINKS_BASE_URL=https://api.cuelinks.com/v1
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=31.97.237.145,${DOMAIN_NAME},www.${DOMAIN_NAME}
      - PYTHONPATH=/app
    volumes:
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
      - /var/log/affiliate-website:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx with production configuration
  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-simple.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
